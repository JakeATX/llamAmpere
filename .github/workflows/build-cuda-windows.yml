name: CI (CUDA, windows)

# llamAmpere release zip: builds llama-server for Windows x64 with CUDA 12.4 from one exact commit.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "full commit sha to build"
        required: true
      name:
        description: "zip base name, e.g. llamampere-v0.7.1-windows-x86_64-cuda12-server"
        required: true

permissions:
  contents: read

jobs:
  windows-cuda-server:
    runs-on: windows-2022
    timeout-minutes: 340

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Check commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
          test -z "$(git status --porcelain)"

      - name: Install Cuda Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '12.4'
          cuda_arch: x64

      - name: Install Ninja
        run: choco install ninja

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON ^
            -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_OPENMP=ON ^
            -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=86 -DGGML_CUDA_FA=ON -DGGML_CUDA_GRAPHS=ON ^
            -DGGML_CUDA_NCCL=OFF -DGGML_CUDA_CCCL_VERSION=v3.4.3 ^
            -DLLAMA_BUILD_BORINGSSL=ON -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF || exit /b 1
          cmake --build build --config Release -j %NUMBER_OF_PROCESSORS% --target llama-server || exit /b 1
          echo VCREDIST=%VCToolsRedistDir%>> %GITHUB_ENV%

      - name: Pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $n = "${{ inputs.name }}"
          $d = "pack\$n"
          New-Item -ItemType Directory -Force $d, "$d\licenses" | Out-Null
          Copy-Item build\bin\*.exe, build\bin\*.dll $d
          foreach ($p in "cudart64_*.dll", "cublas64_*.dll", "cublasLt64_*.dll") {
            $f = Get-ChildItem -Path "$env:CUDA_PATH\bin" -Filter $p
            if (-not $f) { throw "missing $p" }
            Copy-Item $f.FullName $d
          }
          $crt = Get-ChildItem "$env:VCREDIST\x64" -Directory | Where-Object { $_.Name -match '^Microsoft\.VC\d+\.(CRT|OpenMP)$' }
          if (-not $crt) { throw "no VC redist" }
          foreach ($c in $crt) { Copy-Item "$($c.FullName)\*.dll" $d }
          Copy-Item LICENSE $d
          Copy-Item licenses\* "$d\licenses"
          Copy-Item vendor\cpp-httplib\LICENSE "$d\licenses\LICENSE-cpp-httplib"
          Copy-Item "docs\llamampere-v0.7.1\RELEASE_NOTES.md" $d
          "${{ inputs.sha }}" | Set-Content "$d\COMMIT"
          Get-ChildItem $d -Recurse | Select-Object Name, Length | Format-Table -AutoSize

      - name: Version check (no GPU on the runner)
        shell: pwsh
        run: |
          $n = "${{ inputs.name }}"
          $exe = "pack\$n\llama-server.exe"
          $out = & $exe --version 2>&1 | Out-String
          Write-Host "exit=$LASTEXITCODE"
          Write-Host $out
          $out | Set-Content "pack\version.txt"
          $short = "${{ inputs.sha }}".Substring(0, 9)
          $hit = Select-String -Path "pack\$n\*.dll", "pack\$n\*.exe" -Pattern $short -SimpleMatch -List | Select-Object -ExpandProperty Filename
          Write-Host "commit $short found in: $hit"
          "strings: $hit" | Add-Content "pack\version.txt"
          if (-not $hit -and $out -notmatch $short) { throw "commit $short not found in the build" }
          & dumpbin /dependents "pack\$n\llama-server.exe" "pack\$n\ggml-cuda.dll" 2>$null | Select-String "\.dll" | Out-String | Write-Host

      - name: Zip
        shell: pwsh
        run: |
          $n = "${{ inputs.name }}"
          Push-Location pack
          7z a -tzip "..\$n.zip" $n | Out-Null
          Pop-Location
          $h = (Get-FileHash "$n.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  $n.zip" | Set-Content -NoNewline "$n.zip.sha256"
          Get-Content "$n.zip.sha256"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.name }}
          path: |
            ${{ inputs.name }}.zip
            ${{ inputs.name }}.zip.sha256
            pack/version.txt
          retention-days: 14
