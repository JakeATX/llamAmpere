name: llamAmpere Docker image

# Manual only. Builds .devops/llamampere-cuda.Dockerfile for the chosen ref.
# Nothing is published unless the "push" input is set to true.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag or branch) to build, e.g. v0.7.5'
        required: true
        default: 'main'
      cuda_arch:
        description: 'CMAKE_CUDA_ARCHITECTURES (86 = RTX 30-series, "80;86" adds A100)'
        required: true
        default: '86'
      push:
        description: 'Publish the image to ghcr.io'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-llamampere-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  server-cuda12:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Clone
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Image name and tags
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ref_tag=$(echo "${{ inputs.ref }}" | tr '/' '-' | tr -c 'A-Za-z0-9._\n-' '-')
          image=ghcr.io/${owner}/llamampere
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:server-cuda12-${ref_tag}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push if requested)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devops/llamampere-cuda.Dockerfile
          platforms: linux/amd64
          target: server
          build-args: |
            CUDA_ARCH=${{ inputs.cuda_arch }}
            BUILD_JOBS=4
            APP_VERSION=${{ inputs.ref }}
            APP_REVISION=${{ steps.meta.outputs.revision }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: Smoke test (no GPU on the runner)
        if: ${{ !inputs.push }}
        run: |
          # libcuda.so.1 comes from the host driver at run time (NVIDIA Container Toolkit); every other library must resolve
          missing=$(docker run --rm --entrypoint /bin/sh ${{ steps.meta.outputs.tags }} -c 'ldd /app/llama-server | grep "not found" | grep -v libcuda.so' || true)
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
          echo "libraries ok"
